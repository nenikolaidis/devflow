# On every pull request: run the security-rules tests, then deploy a
# temporary preview of the site and comment its link on the PR.
# (Originally generated by `firebase init hosting:github`.)
name: Test and preview pull request

on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  test:
    name: Tests (security rules + browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4    # the Firestore emulator needs Java
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test   # rules tests, then the end-to-end browser test (Chrome is preinstalled on ubuntu-latest)

  build_and_preview:
    name: Preview deploy
    needs: test
    # Forks and Dependabot don't get the deploy secret, so only preview PRs
    # opened by people in this repo. Dependabot PRs still run the tests above.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEVFLOW_BOARD_11146 }}
          projectId: devflow-board-11146
