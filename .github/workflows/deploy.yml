# On every push to main: run the security-rules tests, and only if they
# pass, deploy public/ to Firebase Hosting.
#
# Uses the FIREBASE_SERVICE_ACCOUNT_DEVFLOW_BOARD_11146 secret created by
# `firebase init hosting:github` (GitHub → Settings → Secrets → Actions).
#
# Firestore rules are NOT deployed from here — publish them yourself with
# `npm run deploy:rules` so a rules change is always a deliberate step.
name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  test:
    name: Tests (security rules + browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6    # the Firestore emulator needs Java
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test   # rules tests, then the end-to-end browser test (Chrome is preinstalled on ubuntu-latest)

  deploy:
    name: Deploy to Firebase Hosting
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEVFLOW_BOARD_11146 }}
          projectId: devflow-board-11146
          channelId: live
