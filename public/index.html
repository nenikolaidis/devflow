<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>DEVFLOW — Ticket Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<!-- Third-party scripts are pinned to exact versions with integrity hashes:
     if the CDN ever serves different code, the browser refuses to run it.
     To upgrade, change the version and regenerate the hash — see SECURITY.md. -->
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js" integrity="sha384-Q0LEW691FpfYRwf5Wm8RxncCU5jjPt8sOnvqNfKbvJpb7xXtN/i4KskWhPu5l13a" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js" integrity="sha384-oPlItlVibiTxBVDqjh1xyE8s39UbYx7Bl3JvPvp7DkJQTIleYXIgOpJEVvr+yMV2" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js" integrity="sha384-0P+MepEAg2VQffDzKBsMC7D2a3Qh0Qp2/nXeGk2Q2sQ880cb7scaK6d4qNvxFmM2" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-check-compat.js" integrity="sha384-Ybv3lGuy/hHZj1VLzE7e+sawyrFSbMuEQaKRSfC9W4Q8MK+k/zQKNrxNVagHhXAj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js" integrity="sha384-SALc35EccAf6RzGw4iNsyj7kTPr33K7RoGzYu+7heZhT8s0GZouafRiCg1qy44AS" crossorigin="anonymous"></script>
</head>
<body>

<!-- ============ AUTH SCREEN ============ -->
<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <h1>devflow</h1>
    <p class="sub">Ticket board · sign in to continue</p>
    <div class="auth-tabs">
      <button id="tabLogin" class="active">Log in</button>
      <button id="tabSignup">Sign up</button>
    </div>
    <div class="field"><label>Email</label><input type="email" id="authEmail" placeholder="you@company.com"></div>
    <div class="field"><label>Password</label><input type="password" id="authPassword" placeholder="At least 10 characters"></div>
    <div class="auth-forgot"><a class="link" id="forgotLink">Forgot password?</a></div>
    <div class="auth-error" id="authError"></div>
    <button class="primary" id="authSubmit" style="width:100%;">Log in</button>
    <div class="auth-status" id="authStatus"></div>
  </div>
</div>

<!-- ============ VERIFY EMAIL SCREEN ============ -->
<div id="verifyScreen" class="auth-screen hidden">
  <div class="auth-card pending-box">
    <h1>devflow</h1>
    <p class="sub" style="margin-bottom:18px;">Confirm your email</p>
    <p style="font-size:13px; color:var(--text-secondary);" id="verifyMsg"></p>
    <button class="primary" id="verifiedBtn" style="margin-top:16px; width:100%;">I've confirmed it — continue</button>
    <button id="resendVerifyBtn" style="margin-top:10px; width:100%;">Resend email</button>
    <button class="ghost" id="signOutVerify" style="margin-top:10px; width:100%;">Sign out</button>
  </div>
</div>

<!-- ============ PENDING APPROVAL SCREEN ============ -->
<div id="pendingScreen" class="auth-screen hidden">
  <div class="auth-card pending-box">
    <h1>devflow</h1>
    <p class="sub" style="margin-bottom:18px;">Account created</p>
    <p style="font-size:13px; color:var(--text-secondary);" id="pendingMsg"></p>
    <button class="primary" id="requestAccessBtn" style="margin-top:16px; width:100%;">Request access</button>
    <button id="signOutPending" style="margin-top:10px; width:100%;">Sign out</button>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="brand">
      <span class="brand-mark">devflow</span>
      <span class="brand-tag">ticket board · by Nearchos Nikolaidis</span>
    </div>
    <div class="topbar-actions">
      <span class="role-badge" id="whoami"></span>
      <button class="ghost" id="profileBtn">Profile</button>
      <button class="ghost" id="accountBtn">Account</button>
    </div>
  </div>

  <div class="nav">
    <button id="navBoard" class="active">Board</button>
    <button id="navDashboard">Dashboard</button>
    <button id="navTeam" class="hidden">Team</button>
  </div>

  <!-- BOARD VIEW -->
  <div id="boardView">
    <div class="filterbar">
      <input type="text" id="searchInput" placeholder="Search tickets by title or ID...">
      <select id="priorityFilter">
        <option value="">All priorities</option>
        <option value="critical">Critical</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
      <select id="labelFilter">
        <option value="">All labels</option>
      </select>
      <select id="assigneeFilter">
        <option value="">All assignees</option>
      </select>
      <select id="sortSelect">
        <option value="createdAt:desc">Newest first</option>
        <option value="createdAt:asc">Oldest first</option>
        <option value="priority:asc">Priority: high → low</option>
        <option value="dueDate:asc">Due date: soon first</option>
        <option value="title:asc">Title A–Z</option>
      </select>
      <div class="subtoggle">
        <button id="viewKanbanBtn" class="active">Kanban</button>
        <button id="viewTableBtn">Table</button>
      </div>
      <button id="selectModeBtn">Select</button>
      <button id="archivedToggleBtn" title="Show archived tickets alongside active ones">Archived</button>
      <button class="primary" id="newTicketBtn" style="margin-left:auto;">+ New ticket</button>
    </div>
    <div class="board" id="board"></div>
    <div class="table-wrap hidden" id="ticketTable"></div>
  </div>

  <!-- DASHBOARD VIEW -->
  <div id="dashboardView" class="hidden">
    <div class="dash-grid" id="dashStats"></div>
    <div class="dash-panels" id="dashPanels"></div>
  </div>

  <!-- TEAM VIEW (admin only) -->
  <div id="teamView" class="team-view hidden">
    <h3>Pending requests</h3>
    <div id="requestList"></div>
    <div class="empty-note hidden" id="noRequests">No pending requests.</div>

    <h3>Team members</h3>
    <div id="allowList"></div>
    <div class="add-allow">
      <input type="email" id="newAllowEmail" placeholder="teammate@company.com">
      <select id="newAllowRole">
        <option value="developer">Developer</option>
        <option value="pm">Project manager</option>
        <option value="admin">Administrator</option>
      </select>
      <button id="addAllowBtn">Add</button>
    </div>

    <h3>Board settings</h3>
    <div class="settings-box">
      <div class="field">
        <label>Discord webhook URL — stored in the database, not in the site's code</label>
        <div class="add-allow" style="margin-top:0;">
          <input type="text" id="setWebhook" placeholder="https://discord.com/api/webhooks/…" autocomplete="off">
          <button id="testWebhookBtn">Send test</button>
        </div>
      </div>
      <div class="field">
        <label>Flag a ticket as stale after this many days with no activity (In progress / In review)</label>
        <input type="number" id="setStaleDays" min="1" step="1" style="width:100px;">
      </div>
      <div class="field">
        <label>Work-in-progress limits per column (0 = no limit)</label>
        <div class="wip-inputs" id="setWipLimits"></div>
      </div>
      <div class="modal-actions" style="margin-top:4px;"><button class="primary" id="saveSettingsBtn">Save settings</button></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
