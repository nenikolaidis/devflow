<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="color-scheme" content="light dark">
<title>DEVFLOW — Ticket Board</title>
<!-- Applies a saved light/dark choice before the page paints. -->
<script src="js/theme-init.js"></script>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<!-- Third-party scripts are pinned to exact versions with integrity hashes:
     if the CDN ever serves different code, the browser refuses to run it.
     To upgrade, change the version and regenerate the hash — see SECURITY.md. -->
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js" integrity="sha384-Q0LEW691FpfYRwf5Wm8RxncCU5jjPt8sOnvqNfKbvJpb7xXtN/i4KskWhPu5l13a" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js" integrity="sha384-oPlItlVibiTxBVDqjh1xyE8s39UbYx7Bl3JvPvp7DkJQTIleYXIgOpJEVvr+yMV2" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js" integrity="sha384-0P+MepEAg2VQffDzKBsMC7D2a3Qh0Qp2/nXeGk2Q2sQ880cb7scaK6d4qNvxFmM2" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-check-compat.js" integrity="sha384-Ybv3lGuy/hHZj1VLzE7e+sawyrFSbMuEQaKRSfC9W4Q8MK+k/zQKNrxNVagHhXAj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js" integrity="sha384-SALc35EccAf6RzGw4iNsyj7kTPr33K7RoGzYu+7heZhT8s0GZouafRiCg1qy44AS" crossorigin="anonymous"></script>
</head>
<body>

<!-- ============ SIGN IN / SIGN UP ============ -->
<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-brand">
      <svg class="logo" width="34" height="34" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="var(--accent)"/><path d="M7 9h7M7 13h12M7 17h5" stroke="var(--on-accent)" stroke-width="2" stroke-linecap="round"/></svg>
      <div>
        <h1>Sign in to devflow</h1>
        <p class="sub">Your team's ticket board</p>
      </div>
    </div>
    <div class="segmented auth-tabs" role="tablist" aria-label="Log in or sign up">
      <button type="button" role="tab" id="tabLogin" class="active" aria-selected="true">Log in</button>
      <button type="button" role="tab" id="tabSignup" aria-selected="false">Create account</button>
    </div>
    <div class="field"><label for="authEmail">Email</label><input type="email" id="authEmail" autocomplete="email" placeholder="you@company.com"></div>
    <div class="field">
      <div class="field-label-row">
        <label for="authPassword">Password</label>
        <button type="button" class="link" id="forgotLink">Forgot password?</button>
      </div>
      <input type="password" id="authPassword" autocomplete="current-password" placeholder="At least 10 characters">
    </div>
    <div class="auth-error" id="authError" role="alert"></div>
    <button type="button" class="primary large full-width" id="authSubmit">Log in</button>
    <div class="auth-status" id="authStatus" aria-live="polite"></div>
    <p class="auth-note">New accounts confirm their email, then an admin approves access.</p>
  </div>
</div>

<!-- ============ VERIFY EMAIL ============ -->
<div id="verifyScreen" class="auth-screen hidden">
  <div class="auth-card">
    <div class="auth-brand">
      <svg class="logo" width="34" height="34" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="var(--accent)"/><path d="M7 9h7M7 13h12M7 17h5" stroke="var(--on-accent)" stroke-width="2" stroke-linecap="round"/></svg>
      <div><h1>Confirm your email</h1><p class="sub">One last step before you can join</p></div>
    </div>
    <p class="screen-msg" id="verifyMsg"></p>
    <button type="button" class="primary large full-width" id="verifiedBtn">I've confirmed it — continue</button>
    <button type="button" class="large full-width" id="resendVerifyBtn">Resend email</button>
    <button type="button" class="ghost full-width" id="signOutVerify">Sign out</button>
  </div>
</div>

<!-- ============ PENDING APPROVAL ============ -->
<div id="pendingScreen" class="auth-screen hidden">
  <div class="auth-card">
    <div class="auth-brand">
      <svg class="logo" width="34" height="34" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="var(--accent)"/><path d="M7 9h7M7 13h12M7 17h5" stroke="var(--on-accent)" stroke-width="2" stroke-linecap="round"/></svg>
      <div><h1>Waiting for approval</h1><p class="sub">Your account is ready</p></div>
    </div>
    <p class="screen-msg" id="pendingMsg"></p>
    <button type="button" class="primary large full-width" id="requestAccessBtn">Request access</button>
    <button type="button" class="ghost full-width" id="signOutPending">Sign out</button>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand">
      <svg class="logo" width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="var(--accent)"/><path d="M7 9h7M7 13h12M7 17h5" stroke="var(--on-accent)" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="brand-name">devflow</span>
      <span class="brand-tag">by Nearchos Nikolaidis</span>
    </div>

    <div class="menu-wrap project-switcher">
      <button type="button" class="project-btn" id="projectBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="projectMenu" aria-label="Switch project">
        <span class="project-key" id="projectKey">—</span>
        <span class="project-name" id="projectName">No project</span>
        <svg class="icon" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
      </button>
      <div class="menu project-menu hidden" id="projectMenu" role="menu" aria-label="Projects"></div>
    </div>

    <nav class="tabs" role="tablist" aria-label="Sections">
      <button type="button" role="tab" id="navBoard" class="tab active" aria-selected="true" aria-controls="boardView">Board</button>
      <button type="button" role="tab" id="navMyWork" class="tab" aria-selected="false" aria-controls="myWorkView">My work</button>
      <button type="button" role="tab" id="navDashboard" class="tab" aria-selected="false" aria-controls="dashboardView">Dashboard</button>
      <button type="button" role="tab" id="navManage" class="tab hidden" aria-selected="false" aria-controls="manageView">Manage</button>
    </nav>

    <div class="topbar-spacer"></div>

    <label class="search">
      <svg class="icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
      <span class="sr-only">Search tickets</span>
      <input type="search" id="searchInput" placeholder="Search tickets…" autocomplete="off">
      <kbd aria-hidden="true">/</kbd>
    </label>

    <button type="button" class="primary" id="newTicketBtn">
      <svg class="icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
      <span class="btn-text">New ticket</span>
    </button>

    <div class="menu-wrap">
      <button type="button" class="icon-btn bell-btn" id="notifBtn" aria-haspopup="true" aria-expanded="false" aria-controls="notifPanel" aria-label="Notifications">
        <svg class="icon" width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5V7a4 4 0 0 1 8 0v4.5l1 1.5H3Z"/><path d="M6.5 14.5a1.6 1.6 0 0 0 3 0"/></svg>
        <span class="bell-badge hidden" id="notifCount"></span>
      </button>
      <div class="menu notif-panel hidden" id="notifPanel" role="region" aria-label="Notifications">
        <div class="notif-head"><strong>Notifications</strong><button type="button" class="link" id="notifMarkAll">Mark all read</button></div>
        <div id="notifList" class="notif-list"></div>
      </div>
    </div>

    <button type="button" class="icon-btn" id="themeToggle" aria-label="Switch theme"></button>

    <div class="menu-wrap">
      <button type="button" class="avatar-btn" id="userMenuBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="userMenu" aria-label="Account menu">
        <span id="userAvatar" class="avatar-slot"></span>
        <svg class="icon" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
      </button>
      <div class="menu hidden" id="userMenu" role="menu" aria-label="Account">
        <div class="menu-head">
          <div class="menu-name" id="menuName"></div>
          <div class="menu-sub" id="whoami"></div>
        </div>
        <button type="button" role="menuitem" id="profileBtn">My profile</button>
        <button type="button" role="menuitem" id="accountBtn">Account &amp; password</button>
        <button type="button" role="menuitem" id="systemThemeBtn">Use system theme</button>
        <div class="menu-sep" role="separator"></div>
        <button type="button" role="menuitem" id="signOutBtn" class="danger-text">Sign out</button>
      </div>
    </div>
  </header>

  <main>
  <!-- BOARD -->
  <section id="boardView" role="tabpanel" aria-labelledby="navBoard">
    <div class="toolbar" role="group" aria-label="Filters and view">
      <div class="quick-filters" role="group" aria-label="Quick filters">
        <button type="button" class="quick" data-quick="mine" aria-pressed="false">Mine</button>
        <button type="button" class="quick" data-quick="review" aria-pressed="false" title="In review, and you are a reviewer">To review</button>
        <button type="button" class="quick" data-quick="blocked" aria-pressed="false">Blocked</button>
        <button type="button" class="quick" data-quick="stale" aria-pressed="false">Stale</button>
      </div>
      <span class="toolbar-divider" aria-hidden="true"></span>
      <select id="sprintFilter" class="pill-select" aria-label="Filter by sprint">
        <option value="">Sprint</option>
      </select>
      <select id="typeFilter" class="pill-select" aria-label="Filter by type">
        <option value="">Type</option>
      </select>
      <select id="priorityFilter" class="pill-select" aria-label="Filter by priority">
        <option value="">Priority</option>
        <option value="critical">Critical</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
      <select id="labelFilter" class="pill-select" aria-label="Filter by label">
        <option value="">Label</option>
      </select>
      <select id="assigneeFilter" class="pill-select" aria-label="Filter by owner">
        <option value="">Owner</option>
      </select>
      <span class="toolbar-divider" aria-hidden="true"></span>
      <select id="sortSelect" class="pill-select solid" aria-label="Sort tickets">
        <option value="createdAt:desc">Newest first</option>
        <option value="createdAt:asc">Oldest first</option>
        <option value="priority:asc">Priority: high → low</option>
        <option value="dueDate:asc">Due date: soon first</option>
        <option value="title:asc">Title A–Z</option>
      </select>
      <div class="toolbar-spacer"></div>
      <div class="segmented" role="group" aria-label="View">
        <button type="button" id="viewKanbanBtn" class="active" aria-pressed="true" aria-label="Board view" title="Board view">
          <svg class="icon" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="2.5" width="3.5" height="11" rx="1"/><rect x="6.25" y="2.5" width="3.5" height="7" rx="1"/><rect x="10.5" y="2.5" width="3.5" height="9" rx="1"/></svg>
          <span class="btn-label">Board</span>
        </button>
        <button type="button" id="viewTableBtn" aria-pressed="false" aria-label="Table view" title="Table view">
          <svg class="icon" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
          <span class="btn-label">Table</span>
        </button>
      </div>
      <button type="button" class="btn-outline hidden" id="manageSprintsBtn" title="Create and manage sprints" aria-label="Sprints">
        <svg class="icon" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="10" rx="2"/><path d="M2.5 7h11M5.5 2v3M10.5 2v3"/></svg>
        <span class="btn-label">Sprints</span>
      </button>
      <button type="button" class="btn-outline" id="selectModeBtn" aria-pressed="false" title="Select several tickets" aria-label="Select">
        <svg class="icon" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="2.5"/><path d="m5.5 8 1.8 1.8L10.8 6"/></svg>
        <span class="btn-label">Select</span>
      </button>
      <button type="button" class="btn-outline" id="archivedToggleBtn" aria-pressed="false" title="Show archived tickets alongside active ones" aria-label="Archived">
        <svg class="icon" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="12" height="3" rx="1"/><path d="M3 6v6.5a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V6M6.5 9h3"/></svg>
        <span class="btn-label">Archived</span>
      </button>
    </div>
    <div class="board" id="board"></div>
    <div class="table-wrap hidden" id="ticketTable"></div>
  </section>

  <!-- MY WORK -->
  <section id="myWorkView" class="page hidden" role="tabpanel" aria-labelledby="navMyWork">
    <div class="page-head"><h1>My work</h1><span class="page-sub" id="myWorkSub"></span></div>
    <div class="dash-panels" id="myWorkPanels"></div>
  </section>

  <!-- DASHBOARD -->
  <section id="dashboardView" class="page hidden" role="tabpanel" aria-labelledby="navDashboard">
    <div class="page-head"><h1>Dashboard</h1><span class="page-sub" id="dashSub"></span></div>
    <div class="stat-grid" id="dashStats"></div>
    <div class="dash-panels" id="dashPanels"></div>
  </section>

  <!-- MANAGE (admins, and roles with management permissions) -->
  <section id="manageView" class="manage hidden" role="tabpanel" aria-labelledby="navManage">
    <nav class="manage-nav" id="manageNav" aria-label="Manage sections"></nav>
    <div class="manage-content" id="manageContent"></div>
  </section>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
