<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>DEVFLOW — Ticket Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<!-- Third-party scripts are pinned to exact versions with integrity hashes:
     if the CDN ever serves different code, the browser refuses to run it.
     To upgrade, change the version and regenerate the hash — see SECURITY.md. -->
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js" integrity="sha384-Q0LEW691FpfYRwf5Wm8RxncCU5jjPt8sOnvqNfKbvJpb7xXtN/i4KskWhPu5l13a" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js" integrity="sha384-oPlItlVibiTxBVDqjh1xyE8s39UbYx7Bl3JvPvp7DkJQTIleYXIgOpJEVvr+yMV2" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js" integrity="sha384-0P+MepEAg2VQffDzKBsMC7D2a3Qh0Qp2/nXeGk2Q2sQ880cb7scaK6d4qNvxFmM2" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-check-compat.js" integrity="sha384-Ybv3lGuy/hHZj1VLzE7e+sawyrFSbMuEQaKRSfC9W4Q8MK+k/zQKNrxNVagHhXAj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js" integrity="sha384-SALc35EccAf6RzGw4iNsyj7kTPr33K7RoGzYu+7heZhT8s0GZouafRiCg1qy44AS" crossorigin="anonymous"></script>
</head>
<body>

<!-- ============ AUTH SCREEN ============ -->
<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <h1>devflow</h1>
    <p class="sub">Ticket board · sign in to continue</p>
    <div class="auth-tabs" role="tablist" aria-label="Log in or sign up">
      <button type="button" role="tab" id="tabLogin" class="active" aria-selected="true">Log in</button>
      <button type="button" role="tab" id="tabSignup" aria-selected="false">Sign up</button>
    </div>
    <div class="field"><label for="authEmail">Email</label><input type="email" id="authEmail" autocomplete="email" placeholder="you@company.com"></div>
    <div class="field"><label for="authPassword">Password</label><input type="password" id="authPassword" autocomplete="current-password" placeholder="At least 10 characters"></div>
    <div class="auth-forgot"><button type="button" class="link" id="forgotLink">Forgot password?</button></div>
    <div class="auth-error" id="authError" role="alert"></div>
    <button type="button" class="primary full-width" id="authSubmit">Log in</button>
    <div class="auth-status" id="authStatus" aria-live="polite"></div>
  </div>
</div>

<!-- ============ VERIFY EMAIL SCREEN ============ -->
<div id="verifyScreen" class="auth-screen hidden">
  <div class="auth-card pending-box">
    <h1>devflow</h1>
    <p class="sub screen-sub">Confirm your email</p>
    <p class="screen-msg" id="verifyMsg"></p>
    <button type="button" class="primary full-width stack-first" id="verifiedBtn">I've confirmed it — continue</button>
    <button type="button" class="full-width stack" id="resendVerifyBtn">Resend email</button>
    <button type="button" class="ghost full-width stack" id="signOutVerify">Sign out</button>
  </div>
</div>

<!-- ============ PENDING APPROVAL SCREEN ============ -->
<div id="pendingScreen" class="auth-screen hidden">
  <div class="auth-card pending-box">
    <h1>devflow</h1>
    <p class="sub screen-sub">Account created</p>
    <p class="screen-msg" id="pendingMsg"></p>
    <button type="button" class="primary full-width stack-first" id="requestAccessBtn">Request access</button>
    <button type="button" class="full-width stack" id="signOutPending">Sign out</button>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">devflow</span>
      <span class="brand-tag">ticket board · by Nearchos Nikolaidis</span>
    </div>
    <div class="topbar-actions">
      <span class="role-badge" id="whoami"></span>
      <button type="button" class="ghost" id="profileBtn">Profile</button>
      <button type="button" class="ghost" id="accountBtn">Account</button>
    </div>
  </header>

  <nav class="nav" role="tablist" aria-label="Sections">
    <button type="button" role="tab" id="navBoard" class="active" aria-selected="true" aria-controls="boardView">Board</button>
    <button type="button" role="tab" id="navDashboard" aria-selected="false" aria-controls="dashboardView">Dashboard</button>
    <button type="button" role="tab" id="navTeam" class="hidden" aria-selected="false" aria-controls="teamView">Team</button>
  </nav>

  <main>
  <!-- BOARD VIEW -->
  <section id="boardView" role="tabpanel" aria-labelledby="navBoard">
    <div class="filterbar" role="search">
      <input type="search" id="searchInput" aria-label="Search tickets" placeholder="Search tickets by title or ID...">
      <select id="priorityFilter" aria-label="Filter by priority">
        <option value="">All priorities</option>
        <option value="critical">Critical</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
      <select id="labelFilter" aria-label="Filter by label">
        <option value="">All labels</option>
      </select>
      <select id="assigneeFilter" aria-label="Filter by owner">
        <option value="">All assignees</option>
      </select>
      <select id="sortSelect" aria-label="Sort tickets">
        <option value="createdAt:desc">Newest first</option>
        <option value="createdAt:asc">Oldest first</option>
        <option value="priority:asc">Priority: high → low</option>
        <option value="dueDate:asc">Due date: soon first</option>
        <option value="title:asc">Title A–Z</option>
      </select>
      <div class="subtoggle" role="group" aria-label="View">
        <button type="button" id="viewKanbanBtn" class="active">Kanban</button>
        <button type="button" id="viewTableBtn">Table</button>
      </div>
      <button type="button" id="selectModeBtn" aria-pressed="false">Select</button>
      <button type="button" id="archivedToggleBtn" aria-pressed="false" title="Show archived tickets alongside active ones">Archived</button>
      <button type="button" class="primary push-right" id="newTicketBtn">+ New ticket</button>
    </div>
    <div class="board" id="board"></div>
    <div class="table-wrap hidden" id="ticketTable"></div>
  </section>

  <!-- DASHBOARD VIEW -->
  <section id="dashboardView" class="hidden" role="tabpanel" aria-labelledby="navDashboard">
    <div class="dash-grid" id="dashStats"></div>
    <div class="dash-panels" id="dashPanels"></div>
  </section>

  <!-- TEAM VIEW (admin only) -->
  <section id="teamView" class="team-view hidden" role="tabpanel" aria-labelledby="navTeam">
    <h3>Pending requests</h3>
    <div id="requestList"></div>
    <div class="empty-note hidden" id="noRequests">No pending requests.</div>

    <h3>Team members</h3>
    <div id="allowList"></div>
    <div class="add-allow">
      <input type="email" id="newAllowEmail" aria-label="Email to add" placeholder="teammate@company.com">
      <select id="newAllowRole" aria-label="Role">
        <option value="developer">Developer</option>
        <option value="pm">Project manager</option>
        <option value="admin">Administrator</option>
      </select>
      <button type="button" id="addAllowBtn">Add</button>
    </div>

    <h3>Board settings</h3>
    <div class="settings-box" id="settingsBox">
      <div class="field">
        <label for="setWebhook">Discord webhook URL — stored in the database, not in the site's code</label>
        <div class="add-allow flush">
          <input type="text" id="setWebhook" placeholder="https://discord.com/api/webhooks/…" autocomplete="off">
          <button type="button" id="testWebhookBtn">Send test</button>
        </div>
      </div>
      <div class="field">
        <label for="setStaleDays">Flag a ticket as stale after this many days with no activity (In progress / In review)</label>
        <input type="number" id="setStaleDays" class="narrow-input" min="1" max="365" step="1">
      </div>
      <fieldset class="field">
        <legend>Work-in-progress limits per column (0 = no limit)</legend>
        <div class="wip-inputs" id="setWipLimits"></div>
      </fieldset>
      <div class="modal-actions"><button type="button" class="primary" id="saveSettingsBtn">Save settings</button></div>
    </div>
  </section>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
